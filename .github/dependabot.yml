version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Provided by Magnolia at runtime: updated by hand with magnolia.version (see docs/DEVELOPER.md).
    ignore:
      - dependency-name: "info.magnolia*"  # the Magnolia version we compile against is the oldest one we support
      - dependency-name: "com.vaadin:*"  # must be the Vaadin that Magnolia ships
      - dependency-name: "com.supertext:supertext-sdk"  # not on Maven Central yet: pinned in tools/sdk/install-sdk.sh
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
