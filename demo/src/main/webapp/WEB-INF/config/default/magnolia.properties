# Magnolia configuration of the Supertext demo (one author instance, no public instance).
# Replaces the file of the same name from magnolia-empty-webapp. All state (JCR repository,
# keys, cache, logs) lives under /data: a volume in the container (Railway mounts one there).

supertext.demo.data=/data

magnolia.home=${magnolia.app.rootdir}
magnolia.resources.dir=${magnolia.home}/modules
magnolia.resources.classpath.observation.pattern=.*\\.(ftl|yaml)$
magnolia.cache.startdir=${supertext.demo.data}/cache
magnolia.upload.tmpdir=${supertext.demo.data}/tmp
magnolia.exchange.history=${supertext.demo.data}/history

magnolia.repositories.config=WEB-INF/config/default/repositories.xml
magnolia.repositories.home=${supertext.demo.data}/repositories
magnolia.repositories.jackrabbit.config=WEB-INF/config/repo-conf/jackrabbit-bundle-h2-search.xml
magnolia.repositories.jackrabbit.indexing.optimization=true

log4j.config=WEB-INF/config/default/log4j2.xml
magnolia.logs.dir=${supertext.demo.data}/logs

magnolia.bootstrap.dir=WEB-INF/bootstrap/author WEB-INF/bootstrap/common
magnolia.bootstrap.authorInstance=true
magnolia.bootstrap.samples=false

magnolia.utf8.enabled=true
magnolia.develop=false
magnolia.ui.vaadin.widgetset=info.magnolia.widgetset.MagnoliaWidgetSet
magnolia.ui.vaadin.theme=admincentral

# Install and update modules on startup without the web installer.
magnolia.update.auto=true

magnolia.author.key.location=${supertext.demo.data}/keys/magnolia-activation-keypair.properties
magnolia.password.manager.key.location=${supertext.demo.data}/keys/magnolia-password-manager-keypair.properties
magnolia.cipher.algorithm=RSA/NONE/OAEPWithSHA3-256AndMGF1Padding
# Size of the generated key pairs (Magnolia logs an error when this is missing).
magnolia.keygen.key.length=4096
