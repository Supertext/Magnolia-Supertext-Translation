supertext-translation.settings.review=Übersetzungsprüfung
supertext-translation.settings.review.help=Übersetzungsprüfung: Übersetzungen in eine angekreuzte Sprache laufen über den Prüfdienst von Supertext, damit Prüferinnen und Prüfer sie mit der Erweiterung Supertext Localization Review direkt auf der Website kontrollieren und korrigieren können. Ihre Korrekturen werden beim nächsten Übersetzen der Seite übernommen.
supertext-translation.settings.versionReports=Versionsinformationen an Supertext senden
supertext-translation.settings.versionReports.help=Sendet die URL der Website sowie die Versionen dieses Plugins, des CMS und der Laufzeitumgebung an Supertext, wenn Sie diese Einstellungen speichern und nach einem Update. So sieht der Supertext-Support, welche Version Sie einsetzen. Es werden keine Inhalte, kein API-Schlüssel und keine Personendaten übertragen.
supertext-translation.settings.versionReports.fromEnvironment=Wird durch die Umgebungsvariable {0} festgelegt.
supertext-translation.settings.versionReports.ping=Supertext kann unter {0} prüfen, ob diese Installation erreichbar ist.
supertext-translation.settings.checkSaveFirst=Speichern Sie zuerst die Einstellungen: «Verbindung prüfen» prüft den gespeicherten API-Schlüssel.

supertext-translation.apiKey.hint=Noch kein Supertext-Konto? Erstellen Sie eines auf {0} . Generieren Sie Ihren API-Schlüssel auf supertext.com → Integrations → API ({1}, erfordert die Admin-Rolle).
supertext-translation.apiKey.hintHtml=Noch kein Supertext-Konto? <a href="{0}" target="_blank" rel="noopener">Erstellen Sie eines auf supertext.com</a>. Generieren Sie Ihren API-Schlüssel auf <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (erfordert die Admin-Rolle).

supertext-translation.keyCheck.ok=API-Schlüssel geprüft: Die Verbindung zu Supertext funktioniert.
supertext-translation.keyCheck.invalid=Supertext hat den API-Schlüssel abgelehnt. Prüfen Sie, ob Sie den ganzen Schlüssel kopiert haben, oder erstellen Sie einen neuen unter <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (erfordert die Rolle Admin). Noch kein Supertext-Konto? Erstellen Sie eines auf <a href="{0}" target="_blank" rel="noopener">supertext.com</a>.
supertext-translation.keyCheck.missing=Es ist noch kein API-Schlüssel eingetragen. Noch kein Supertext-Konto? Erstellen Sie eines auf <a href="{0}" target="_blank" rel="noopener">supertext.com</a>. Ihren API-Schlüssel erstellen Sie unter <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (erfordert die Rolle Admin).
supertext-translation.keyCheck.unreachable=Der API-Schlüssel konnte nicht geprüft werden, weil Supertext nicht erreichbar ist. Die Einstellungen sind gespeichert; prüfen Sie ihn später erneut.
supertext-translation.keyCheck.error=Der API-Schlüssel konnte nicht geprüft werden: Supertext hat mit einem Fehler geantwortet ({2}). Die Einstellungen sind gespeichert; prüfen Sie ihn später erneut.
