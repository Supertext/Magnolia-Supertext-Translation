supertext-translation.dialog.intro=Supertext übersetzt die Texte dieser Seite samt ihren Komponenten aus der Hauptsprache der Website in die angekreuzten Sprachen. Die Übersetzungen werden in der Seite gespeichert; öffnen Sie sie in der jeweiligen Sprache, um sie vor dem Veröffentlichen zu prüfen.
