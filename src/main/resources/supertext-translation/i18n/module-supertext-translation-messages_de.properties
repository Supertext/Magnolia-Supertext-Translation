supertext-translation.settings.languageCodes=Sprachcodes
supertext-translation.settings.languageCodes.help=Wählen Sie für jede Sprache der Website die Supertext-Sprache, in die übersetzt wird. Für die Hauptsprache gilt dieselbe Auswahl als Ausgangssprache (de-CH wird als de gesendet). Vorausgewählt ist der gleiche Code, sonst die Vorgabe von Supertext (de → de-DE, en → en-US, fr → fr-FR, it → it-IT, pt → pt-PT, zh → zh-Hans, es_ES → es). Eine Sprache ohne Vorgabe (z. B. de_LI, en_IE, gsw) zeigt „— auswählen —“ und wird erst übersetzt, wenn Sie einen Code wählen. Klicken Sie auf Speichern, um die Auswahl zu speichern.
supertext-translation.settings.languageCodes.choose=— auswählen —
supertext-translation.settings.languageCodes.invalid=Der für {0} gewählte Sprachcode ist kein Supertext-Sprachcode. Wählen Sie einen aus der Liste.
supertext-translation.settings.excluded=Nie übersetzen
supertext-translation.settings.additional=Zusätzlich übersetzen
supertext-translation.settings.fields.help=Eigenschaftsnamen, durch Komma oder Zeilenumbruch getrennt. Standardmässig übersetzt: alle Text- und Rich-Text-Felder, die im Dialog einer Seite oder Komponente mit i18n: true markiert sind. «Zusätzlich übersetzen» ergänzt Eigenschaften, die kein Dialog beschreibt (z. B. importierte Inhalte).
