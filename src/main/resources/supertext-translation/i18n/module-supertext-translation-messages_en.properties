supertext-translation.keyCheck.missing=No API key is set yet. No Supertext account yet? Create one at <a href="{0}" target="_blank" rel="noopener">supertext.com</a>. Generate your API key at <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (requires the Admin role).
