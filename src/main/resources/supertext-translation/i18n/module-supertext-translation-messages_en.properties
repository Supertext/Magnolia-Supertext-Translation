supertext-translation.settings.languageMapping.help=One per line, Magnolia language = Supertext code, e.g. de=de-CH (German for Switzerland) or en=en-US. Needed for every site language that isn’t a Supertext code already: de_CH, fr_CH, it_CH, es or nl are sent as they are, but de, fr, it, en and pt need a region, and Supertext doesn’t guess one. The same line serves the site’s main language (sent as de). The table shows how each site language is sent.
