supertext-translation.settings.additional=Traduire aussi
supertext-translation.settings.fields.help=Noms de propriétés, séparés par des virgules ou des retours à la ligne. Traduits par défaut : tous les champs texte et texte enrichi marqués i18n: true dans la boîte de dialogue d’une page ou d’un composant. « Traduire aussi » ajoute des propriétés qu’aucune boîte de dialogue ne décrit (p. ex. contenu importé).
