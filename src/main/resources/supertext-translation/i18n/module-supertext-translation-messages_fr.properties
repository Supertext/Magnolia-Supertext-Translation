supertext-translation.apiKey.hint=Pas encore de compte Supertext ? Créez-en un sur {0} . Générez votre clé API sur supertext.com → Integrations → API ({1}, rôle Admin requis).
supertext-translation.apiKey.hintHtml=Pas encore de compte Supertext ? <a href="{0}" target="_blank" rel="noopener">Créez-en un sur supertext.com</a>. Générez votre clé API sur <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (rôle Admin requis).

supertext-translation.keyCheck.ok=Clé API vérifiée : la connexion à Supertext fonctionne.
supertext-translation.keyCheck.invalid=Supertext a refusé la clé API. Vérifiez que vous avez copié la clé entière ou générez-en une nouvelle sur <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (rôle Admin requis). Pas encore de compte Supertext ? Créez-en un sur <a href="{0}" target="_blank" rel="noopener">supertext.com</a>.
supertext-translation.keyCheck.missing=Aucune clé API n’est encore saisie. Pas encore de compte Supertext ? Créez-en un sur <a href="{0}" target="_blank" rel="noopener">supertext.com</a>. Générez votre clé API sur <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (rôle Admin requis).
supertext-translation.keyCheck.unreachable=La clé API n’a pas pu être vérifiée, car Supertext n’est pas joignable. Les paramètres sont enregistrés ; réessayez plus tard.
supertext-translation.keyCheck.error=La clé API n’a pas pu être vérifiée : Supertext a répondu par une erreur ({2}). Les paramètres sont enregistrés ; réessayez plus tard.
