supertext-translation.settings.languageCodes=Codes de langue
supertext-translation.settings.languageCodes.help=Pour chaque langue du site, choisissez la langue Supertext dans laquelle elle est traduite. La langue principale utilise le même choix comme langue source (de-CH est envoyé comme de). Présélectionné : le même code, sinon la valeur par défaut de Supertext (de → de-DE, en → en-US, fr → fr-FR, it → it-IT, pt → pt-PT, zh → zh-Hans, es_ES → es). Une langue sans valeur par défaut (p. ex. de_LI, en_IE, gsw) affiche « — choisir — » et n’est pas traduite tant que vous n’avez pas choisi de code. Cliquez sur Enregistrer pour enregistrer les choix.
supertext-translation.settings.languageCodes.choose=— choisir —
supertext-translation.settings.languageCodes.invalid=Le code de langue choisi pour {0} n’est pas un code de langue Supertext. Choisissez-en un dans la liste.
supertext-translation.settings.excluded=Ne jamais traduire
supertext-translation.settings.additional=Traduire aussi
supertext-translation.settings.fields.help=Noms de propriétés, séparés par des virgules ou des retours à la ligne. Traduits par défaut : tous les champs texte et texte enrichi marqués i18n: true dans la boîte de dialogue d’une page ou d’un composant. « Traduire aussi » ajoute des propriétés qu’aucune boîte de dialogue ne décrit (p. ex. contenu importé).
supertext-translation.settings.timeout=Délai d’attente (secondes)
supertext-translation.settings.timeoutInvalid=Le délai d’attente doit être compris entre 10 et 3600 secondes.
