supertext-translation.settings.versionReports=Envoyer les informations de version à Supertext
supertext-translation.settings.versionReports.help=Envoie à Supertext l'URL du site ainsi que les versions de ce plugin, du CMS et de l'environnement d'exécution lorsque vous enregistrez ces paramètres et après une mise à jour. Le support Supertext voit ainsi quelle version vous utilisez. Aucun contenu, aucune clé API et aucune donnée personnelle ne sont transmis.
supertext-translation.settings.versionReports.fromEnvironment=Défini par la variable d’environnement {0}.
supertext-translation.settings.versionReports.ping=Supertext peut vérifier à l’adresse {0} que cette installation est joignable.
