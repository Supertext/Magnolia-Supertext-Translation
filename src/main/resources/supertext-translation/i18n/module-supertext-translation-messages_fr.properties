supertext-translation.settings.languageMapping=Codes de langue
supertext-translation.settings.languageMapping.help=Une ligne par langue, langue Magnolia = code Supertext, p. ex. de=de-CH (allemand pour la Suisse) ou en=en-US. Nécessaire pour chaque langue du site qui n’est pas déjà un code Supertext : de_CH, fr_CH, it_CH, es ou nl sont envoyés tels quels, mais de, fr, it, en et pt ont besoin d’une région, et Supertext n’en devine aucune. La même ligne vaut pour la langue principale du site (envoyée comme de). Le tableau montre comment chaque langue est envoyée.
