supertext-translation.settings.versionReports=Inviare le informazioni sulla versione a Supertext
supertext-translation.settings.versionReports.help=Invia a Supertext l'URL del sito e le versioni di questo plugin, del CMS e dell'ambiente di esecuzione quando salva queste impostazioni e dopo un aggiornamento. In questo modo l'assistenza Supertext vede quale versione utilizza. Non vengono trasmessi contenuti, chiavi API né dati personali.
