supertext-translation.keyCheck.ok=Chiave API verificata: la connessione a Supertext funziona.
supertext-translation.keyCheck.invalid=Supertext ha rifiutato la chiave API. Verifichi di aver copiato l’intera chiave oppure ne generi una nuova su <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (richiede il ruolo Admin). Non ha ancora un account Supertext? Ne crei uno su <a href="{0}" target="_blank" rel="noopener">supertext.com</a>.
supertext-translation.keyCheck.missing=Non è ancora stata inserita alcuna chiave API. Non ha ancora un account Supertext? Ne crei uno su <a href="{0}" target="_blank" rel="noopener">supertext.com</a>. Generi la Sua chiave API su <a href="{1}" target="_blank" rel="noopener">supertext.com → Integrations → API</a> (richiede il ruolo Admin).
