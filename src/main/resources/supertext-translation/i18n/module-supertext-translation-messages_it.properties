supertext-translation.settings.additional=Traduci anche
supertext-translation.settings.fields.help=Nomi di proprietà, separati da virgola o a capo. Tradotti per impostazione predefinita: tutti i campi di testo e di testo formattato marcati con i18n: true nella finestra di dialogo di una pagina o di un componente. «Traduci anche» aggiunge proprietà non descritte da alcuna finestra di dialogo (ad es. contenuti importati).
supertext-translation.settings.timeout=Timeout (secondi)
supertext-translation.settings.timeoutInvalid=Il timeout deve essere compreso tra 10 e 3600 secondi.
