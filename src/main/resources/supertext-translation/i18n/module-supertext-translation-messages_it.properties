supertext-translation.settings.languageCodes=Codici lingua
supertext-translation.settings.languageCodes.help=Per ogni lingua del sito scelga la lingua Supertext in cui viene tradotta. Per la lingua principale vale la stessa scelta come lingua di partenza (de-CH viene inviato come de). Preselezionato: lo stesso codice, altrimenti il valore predefinito di Supertext (de → de-DE, en → en-US, fr → fr-FR, it → it-IT, pt → pt-PT, zh → zh-Hans, es_ES → es). Una lingua senza valore predefinito (ad es. de_LI, en_IE, gsw) mostra «— scegliere —» e non viene tradotta finché non sceglie un codice. Clicchi su Salva per salvare le scelte.
supertext-translation.settings.languageCodes.choose=— scegliere —
